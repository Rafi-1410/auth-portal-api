openapi: 3.0.3
info:
  title: Auth Portal API
  version: 1.0.0
  description: |
    REST API portal autentikasi: registrasi, login, dan akses profil dengan JWT.

    Alur: `POST /auth/register` atau `POST /auth/login` mengembalikan `accessToken`.
    Klik **Authorize**, tempel token tersebut, lalu panggil `GET /users/me`.
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Users

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Membuat akun baru
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Akun berhasil dibuat, langsung mendapat token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Email sudah terdaftar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                error: { code: CONFLICT, message: Email is already registered }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login dengan email dan password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Email atau password salah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                error: { code: UNAUTHORIZED, message: Invalid email or password }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /users/me:
    get:
      tags: [Users]
      summary: Profil user yang sedang login
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Data profil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/User' }
        '401':
          description: Token tidak ada, tidak valid, atau kedaluwarsa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: User pemilik token sudah tidak ada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required: [name, email, gender, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 100, example: Budi Santoso }
        email: { type: string, format: email, example: budi@example.com }
        gender: { type: string, enum: [male, female], example: male }
        password: { type: string, minLength: 8, maxLength: 72, example: rahasia123 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: budi@example.com }
        password: { type: string, example: rahasia123 }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Budi Santoso }
        email: { type: string, example: budi@example.com }
        gender: { type: string, enum: [male, female] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AuthResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            user: { $ref: '#/components/schemas/User' }
            accessToken: { type: string, example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9... }
            tokenType: { type: string, example: Bearer }
            expiresIn: { type: string, example: 1h }

    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }

  responses:
    ValidationError:
      description: Input tidak valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - { field: email, message: email is not valid }
    TooManyRequests:
      description: Terlalu banyak percobaan, coba lagi nanti
